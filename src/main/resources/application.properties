spring.application.name=ISDProjectHelios

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/heliosdb}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:admin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true

spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC

groq.api.key=${GROQ_API_KEY:}

# Secret di firma JWT (HS256, minimo 32 caratteri). In produzione SEMPRE sovrascritto via env JWT_SECRET.
jwt.secret=${JWT_SECRET:change-me-please-set-a-strong-jwt-secret-key-min-32-chars}
